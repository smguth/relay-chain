name: runner

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tunnel tool
        run: |
          curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o /tmp/ngrok.tgz
          tar -xzf /tmp/ngrok.tgz -C /tmp
          chmod +x /tmp/ngrok

      - name: Serve
        env:
          EQ_RELAY_TOKEN: ${{ secrets.EQ_RELAY_TOKEN }}
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANDS=$(python3 -c "print(','.join('69.174.%d.%d'%(b,i) for b in (200,201,202) for i in range(256)))")
          EQ_RELAY_WS_PORT=40000 EQ_RELAY_ZONE_CANDIDATES="$CANDS" nohup python3 relay.py > relay.log 2>&1 &
          /tmp/ngrok config add-authtoken "$NGROK_TOKEN"
          nohup /tmp/ngrok http 40000 --log=stdout > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(curl -s http://127.0.0.1:4040/api/tunnels | python3 -c "import sys,json; ts=json.load(sys.stdin).get('tunnels',[]); print(next((t['public_url'] for t in ts if t['public_url'].startswith('https://')), ''))" 2>/dev/null)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "tunnel did not come up"
            cat tunnel.log
            exit 1
          fi
          echo "endpoint: $URL"
          echo -n "$URL" > current-url.txt
          git config user.name "runner"
          git config user.email "runner@localhost"
          git add current-url.txt
          git commit -m "endpoint" || true
          git push || true
          ( sleep 19000; gh workflow run relay.yml ) &
          sleep 20400
          sleep 600
